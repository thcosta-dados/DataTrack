x-airflow-common:
  &airflow-common
  build: .
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    # Variaveis injetadas a partir do .env para o Airflow enxergar nativamente
    - ADZUNA_APP_ID=${ADZUNA_APP_ID}
    - ADZUNA_APP_KEY=${ADZUNA_APP_KEY}
    - JOOBLE_API_KEY=${JOOBLE_API_KEY}
    - MINIO_ROOT_USER=${MINIO_ROOT_USER}
    - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    # Conexao com o PostgreSQL na nuvem (Supabase) para a Silver Layer
    - SUPABASE_DB_URL=${SUPABASE_DB_URL}
    # Gemini API Key para classificador inteligente
    - GEMINI_API_KEY=${GEMINI_API_KEY}
    # Informa ao dbt onde esta o profiles.yml dentro do container
    - DBT_PROFILES_DIR=/opt/airflow/dbt
    # Variaveis do dbt profiles.yml (env_var)
    - DBT_PG_HOST=${DBT_PG_HOST:-localhost}
    - DBT_PG_USER=${DBT_PG_USER:-postgres}
    - DBT_PG_PASSWORD=${DBT_PG_PASSWORD:-password}
    - DBT_PG_PORT=${DBT_PG_PORT:-5432}
    - DBT_PG_DBNAME=${DBT_PG_DBNAME:-postgres}
    # Email Digest
    - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
    - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-}
    - DIGEST_TO_EMAIL=${DIGEST_TO_EMAIL:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins
    - ./logs:/opt/airflow/logs
    # Monta o projeto dbt dentro do container para o BashOperator enxergar
    - ./dbt:/opt/airflow/dbt
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  streamlit:
    build: .
    entrypoint: []
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/opt/airflow/dashboard
    environment:
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

volumes:
  postgres-data:
