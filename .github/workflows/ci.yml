name: DataTrack CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    services:
      # Inicializa o Postgres local no runner do GitHub Actions
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest dbt-core dbt-postgres

      - name: Set up database schema
        env:
          PGPASSWORD: password
        run: |
          # Roda o script de banco para gerar a estrutura Silver (incluindo as tabelas de auditoria)
          psql -h localhost -U postgres -d postgres -f sql/create_silver_schema.sql

      - name: Run Python unit tests
        env:
          # Define a URL de conexao apontando para o Postgres do CI
          SUPABASE_DB_URL: postgresql://postgres:password@localhost:5432/postgres
        run: |
          python -m pytest tests/ -v

      - name: Set up dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          datatrack:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                user: postgres
                password: password
                port: 5432
                dbname: postgres
                schema: gold
                threads: 1
          EOF

      - name: Run dbt dependencies
        run: |
          dbt deps --project-dir ./dbt

      - name: Run dbt models & tests (Dry Run)
        run: |
          # Valida se todos os modelos dbt rodam e passam nas restricoes no banco do CI
          dbt run --project-dir ./dbt --profiles-dir ~/.dbt
          dbt test --project-dir ./dbt --profiles-dir ~/.dbt
