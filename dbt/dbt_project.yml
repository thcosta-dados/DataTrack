name: 'datatrack'
version: '1.0.0'
config-version: 2

# O profile que aponta para o profiles.yml com as credenciais do Supabase
profile: 'datatrack'

# Caminhos dos diretorios padrao do projeto
model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Diretorio onde o dbt gera os artefatos compilados
target-path: "target"

# Pastas que o dbt ignora ao compilar
clean-targets:
  - "target"
  - "dbt_packages"

# Estrategia de materializacao por camada
# - staging: view (sem custo de armazenamento, sempre atualizado)
# - intermediate: table (logica de negocio materializada para performance)
# - marts: table por padrao, fact_job_posting sobrescreve para incremental
models:
  datatrack:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
